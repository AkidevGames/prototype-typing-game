<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Typing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
    <h1>Prototype Typing Game</h1>

    <!-- These are the buttons for the l&d themes probably.--> 
<div class="theme-controls">
    <span class="theme-label">Theme:</span>

    <button
        id="light-theme-button"
        class="theme-button"
        type="button"
    >
        Light
    </button>

    <button
        id="dark-theme-button"
        class="theme-button"
        type="button"
    >
        Dark
    </button>

    <button
        id="custom-theme-button"
        class="theme-button"
        type="button"
        disabled
    >
        Custom
    </button>
</div>

    <section class="game-panel">
        <p class="label">Type this word:</p>

        <p id="target-word" class="target-word">Loading...</p>

        <input
            id="word-input"
            class="word-input"
            type="text"
            placeholder="Type here"
            autocomplete="off"
            spellcheck="false"
        >

        <p class="instruction">
            Press Enter or Space to confirm.
        </p>

<p class="score">
    Successful words:
    <span id="score">0</span>

    <span
        id="score-feedback"
        class="score-feedback"
        aria-hidden="true"
    >
        ↑
    </span>
</p>
    </section>
</main>

    <script src="script.js"></script>
</body>
</html>
