<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype Typing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
    <h1>Prototype Typing Game</h1>

    <section class="game-panel">
        <p class="label">Type this word:</p>

        <p id="target-word" class="target-word">Loading...</p>

        <input
            id="word-input"
            class="word-input"
            type="text"
            placeholder="Type here"
            autocomplete="off"
            spellcheck="false"
        >

        <p class="instruction">
            Press Enter or Space to confirm.
        </p>

        <p class="score">
            Successful words:
            <span id="score">0</span>
        </p>
    </section>
</main>

    <script src="script.js"></script>
</body>
</html>
